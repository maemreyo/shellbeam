version = 1
global = ["go.mod", "go.sum"]

[[mapping]]
glob = "api/schema/**"
suites = ["./api/schema", "./tests/contract"]

[[mapping]]
glob = "docs/**"
suites = ["contract:markdown"]

[[mapping]]
glob = "tools/devctl/**"
suites = ["./tools/devctl"]

[[mapping]]
glob = "dev/**"
suites = ["./tools/devctl"]

[[mapping]]
glob = "Makefile"
suites = ["./tools/devctl"]

[[mapping]]
glob = "AGENTS.md"
suites = ["contract:markdown"]
