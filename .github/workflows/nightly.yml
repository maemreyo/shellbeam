name: nightly
on:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  hardening:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - run: ./scripts/check-json-mode.sh
      - run: ./scripts/test-hardening.sh
