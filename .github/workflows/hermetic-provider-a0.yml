name: hermetic-provider-a0

on:
  pull_request:
    paths:
      - scripts/test-hermetic-provider-a0.sh
      - .github/workflows/hermetic-provider-a0.yml
      - docs/superpowers/evidence/2026-08-18-hermetic-provider-qualification.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-bubblewrap-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BWRAP_TAG: v0.11.2
      BWRAP_COMMIT: 1b80120ef26a28e065e67f89bfef873f13bdd317
    steps:
      - uses: actions/checkout@v7

      - name: Install qualification-only build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config libcap-dev libselinux1-dev strace

      - name: Build exact upstream bubblewrap provider
        run: |
          set -euo pipefail
          rm -rf .build/hermetic-a0-source .build/hermetic-a0-provider
          mkdir -p .build/hermetic-a0-source .build/hermetic-a0-provider .build/hermetic-a0
          git clone --quiet --depth 1 --branch "$BWRAP_TAG" \
            https://github.com/containers/bubblewrap.git .build/hermetic-a0-source/bubblewrap
          test "$(git -C .build/hermetic-a0-source/bubblewrap rev-parse HEAD)" = "$BWRAP_COMMIT"
          test "$(git -C .build/hermetic-a0-source/bubblewrap describe --tags --exact-match)" = "$BWRAP_TAG"
          meson setup .build/hermetic-a0-source/bubblewrap/_build \
            .build/hermetic-a0-source/bubblewrap \
            -Dselinux=disabled -Dtests=false
          meson compile -C .build/hermetic-a0-source/bubblewrap/_build
          install -m 0755 .build/hermetic-a0-source/bubblewrap/_build/bwrap \
            .build/hermetic-a0-provider/bwrap
          test "$(.build/hermetic-a0-provider/bwrap --version)" = 'bubblewrap 0.11.2'
          test ! -u .build/hermetic-a0-provider/bwrap
          test ! -g .build/hermetic-a0-provider/bwrap
          {
            printf 'source_repo=%s\n' 'https://github.com/containers/bubblewrap.git'
            printf 'source_tag=%s\n' "$BWRAP_TAG"
            printf 'source_commit=%s\n' "$BWRAP_COMMIT"
            printf 'binary_sha256=%s\n' "$(sha256sum .build/hermetic-a0-provider/bwrap | awk '{print $1}')"
            printf 'binary_mode=%s\n' "$(stat -c '%a' .build/hermetic-a0-provider/bwrap)"
            printf 'runner=%s\n' "$(uname -srmo)"
          } > .build/hermetic-a0/source-build.txt

      - name: Run native provider qualification matrix
        env:
          HERMETIC_A0_BWRAP: ${{ github.workspace }}/.build/hermetic-a0-provider/bwrap
        run: ./scripts/test-hermetic-provider-a0.sh

      - name: Upload bounded A0 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermetic-provider-a0-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            .build/hermetic-a0/*.txt
            .build/hermetic-a0/*.log
            .build/hermetic-a0/*.manifest
            .build/hermetic-a0/*.strace
