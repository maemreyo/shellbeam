name: checkpoint
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - run: go run ./tools/devctl verify --checkpoint --base '${{ github.event.pull_request.base.sha || github.event.before }}' --json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: .build/receipts/
